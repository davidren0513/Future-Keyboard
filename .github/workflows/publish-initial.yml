name: Publish initial tested release
on:
  push:
    paths: ['.github/workflows/publish-initial.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b39317ae532ad5e38d4fa5d19613f807f47b874
      - name: Restore reviewed binary assets and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,urllib.request
          repository=os.environ['GITHUB_REPOSITORY']
          chunks=[{"sha":"55316b9d33ce36d3d9ae7d2f3d0f44baf89bba53","size":25165824},{"sha":"91da22693ee1de76b45076f1b0c17b45ccc58ece","size":23655363},{"sha":"fd8ee2fb6e49b74522af70d6b354526817c1bffd","size":10100940}]
          def download(chunk):
              request=urllib.request.Request(f"https://api.github.com/repos/{repository}/git/blobs/{chunk['sha']}",headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=120) as response:
                  payload=json.load(response)
              assert payload['encoding']=='base64'
              data=base64.b64decode(payload['content'])
              assert len(data)==chunk['size']
              return data
          directory=pathlib.Path('dist')
          directory.mkdir()
          apk=directory/'FutureKeyboard-v0.6.0-debug.apk'
          apk.write_bytes(download(chunks[0])+download(chunks[1]))
          sources=directory/'dictionary-source-v0.6.0.zip'
          sources.write_bytes(download(chunks[2]))
          expected={apk.name:'598b762a20e4a2cafb4c7cbb909224029f12e69d2edaa2864ad4720052e6c553',sources.name:'c7b9b31fda3a98ab4a55e31f47f5bf914ef2af827df2b72a2f04546b2afcd1d3'}
          for file in [apk,sources]:
              assert hashlib.sha256(file.read_bytes()).hexdigest()==expected[file.name],file.name
          (directory/'SHA256SUMS').write_text(''.join(checksum+'  '+name+'\n' for name,checksum in expected.items()))
      - name: Publish 0.6.0 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.0 dist/FutureKeyboard-v0.6.0-debug.apk dist/SHA256SUMS dist/dictionary-source-v0.6.0.zip --repo "$GITHUB_REPOSITORY" --target 0b39317ae532ad5e38d4fa5d19613f807f47b874 --title 'Future Keyboard 0.6.0 · 永不联网的隐私输入法（测试版）' --notes-file docs/releases/v0.6.0.md --prerelease
