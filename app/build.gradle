plugins { id 'com.android.application' }
android {
    namespace 'com.liquidglass.ime'
    compileSdk 35
    defaultConfig { applicationId 'com.liquidglass.ime'; minSdk 26; targetSdk 35; versionCode 7; versionName '0.6.0'; testInstrumentationRunner 'com.liquidglass.ime.CandidateFlowInstrumentation' }
    androidResources { noCompress += ['bin'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
